<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#ffffff" />
  <title>YEAR SCORE — Demo</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="app.css" />
</head>
<body class="app-page is-demo">
  <a class="skip-link" href="#view" data-i18n="app.skip">Skip to content</a>

  <header class="app-header">
    <div class="app-bar">
      <a class="app-wordmark" href="#/home" data-i18n-label="app.home">YEAR SCORE</a>
      <span class="demo-badge" data-i18n="demo.badge">Demo</span>
      <div class="app-account">
        <button id="demo-reset" type="button" class="link-button" data-i18n="demo.reset">Start over</button>
        <a href="schedule.html" class="link-button demo-signup" data-i18n="demo.signup">Sign up</a>
      </div>
    </div>
  </header>
  <p class="demo-note" data-i18n="demo.note">Try everything without an account. Your changes stay until you close this tab. Sample scores are placeholders for the demo — not the actual music.</p>

  <main id="view" class="app-main" tabindex="-1">
    <p class="meta" data-i18n="common.loading">Loading…</p>
  </main>

  <nav class="app-tabs" data-i18n-label="app.nav">
    <a href="#/home" data-nav="home">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      <span data-i18n="nav.home">Calendar</span>
    </a>
    <a href="#/library" data-nav="library">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h10a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3V4Z"/><path d="M5 17a3 3 0 0 1 3-3h10"/></svg>
      <span data-i18n="nav.repertoire">Score Library</span>
    </a>
    <a href="#/search" data-nav="search">
      <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span data-i18n="nav.search">Search</span>
    </a>
  </nav>

  <p id="app-status" class="app-status" role="status" hidden></p>

  <script type="module" src="js/demo.js"></script>
</body>
</html>
