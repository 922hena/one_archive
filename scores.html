<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ONE ARCHIVE 악보 보관함. 촬영한 악보를 여러 페이지로 저장하고 다시 엽니다." />
  <meta name="theme-color" content="#f3f3f1" />
  <title>ONE ARCHIVE — 악보</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="schedule-page scores-page">
  <a class="skip-link" href="#main">본문으로 바로가기</a>

  <header class="site-header" data-header>
    <div class="header-inner shell">
      <a class="wordmark" href="index.html" aria-label="ONE ARCHIVE 소개로 이동">
        <span>ONE</span><span>ARCHIVE</span>
      </a>
      <nav class="header-links" aria-label="화면 이동">
        <a class="quiet-link" href="schedule.html">일정</a>
        <a class="quiet-link" href="index.html">소개</a>
      </nav>
    </div>
  </header>

  <main id="main" class="schedule-main">
    <div class="shell schedule-layout">
      <div class="schedule-intro">
        <p class="eyebrow">MY LIBRARY</p>
        <h1>악보</h1>
        <p class="schedule-lead">종이 악보를 촬영해 여러 페이지를 하나의 악보로 저장합니다. 다음에 로그인해도 다시 열 수 있습니다.</p>
        <p id="account-line" class="account-line" hidden></p>
        <button id="logout-button" class="text-button" type="button" hidden>로그아웃</button>
      </div>

      <div class="schedule-panels">
        <p id="setup-message" class="notice" hidden></p>

        <section id="auth-panel" class="panel-card" aria-labelledby="auth-title">
          <h2 id="auth-title">로그인</h2>
          <form id="auth-form">
            <label class="field">
              <span>이메일</span>
              <input id="email" name="email" type="email" autocomplete="email" required />
            </label>
            <label class="field">
              <span>비밀번호</span>
              <input id="password" name="password" type="password" autocomplete="current-password" minlength="6" required />
            </label>
            <div class="form-actions">
              <button id="login-button" class="primary-button" type="submit">로그인</button>
              <a class="text-button" href="schedule.html">회원가입은 일정 화면에서</a>
            </div>
          </form>
          <p id="auth-message" class="notice" role="status" hidden></p>
        </section>

        <section id="library-panel" class="panel-card" aria-labelledby="library-title" hidden>
          <div class="score-toolbar">
            <h2 id="library-title">내 악보</h2>
            <button id="new-score-button" class="primary-button" type="button">악보 추가</button>
          </div>
          <p id="list-message" class="notice" role="status" hidden></p>
          <div id="score-list" class="score-list" aria-live="polite"></div>
        </section>

        <section id="editor-panel" class="panel-card" aria-labelledby="editor-title" hidden>
          <h2 id="editor-title">악보 추가</h2>
          <form id="score-form" novalidate>
            <label class="field">
              <span>악보 제목 <em>선택</em></span>
              <input id="score-title" name="title" type="text" maxlength="200" autocomplete="off" />
            </label>

            <div class="field">
              <span>페이지 추가 <em>선택</em></span>
              <div class="capture-actions">
                <button id="camera-button" class="capture-button" type="button">카메라로 촬영</button>
                <button id="library-button" class="capture-button" type="button">사진·PDF 선택</button>
              </div>
              <p class="hint">촬영하거나 JPG, PNG, HEIC 사진, PDF(20MB까지)를 최대 30개까지 한 악보로 묶을 수 있습니다. 제목을 비우면 날짜와 시간으로 저장됩니다.</p>
              <input id="camera-input" type="file" accept="image/*" capture="environment" hidden />
              <input id="library-input" type="file" accept="image/*,.heic,.heif,application/pdf,.pdf" multiple hidden />
            </div>

            <p id="prepare-message" class="notice" role="status" hidden></p>
            <ol id="page-strip" class="page-strip" aria-label="악보 페이지 미리보기"></ol>

            <p id="progress" class="score-progress" role="status" aria-live="polite" hidden></p>
            <p id="editor-message" class="notice" role="status" hidden></p>

            <div class="form-actions">
              <button id="save-button" class="primary-button" type="submit">악보 저장</button>
              <button id="cancel-button" class="text-button" type="button">취소</button>
            </div>
          </form>
        </section>

        <section id="viewer-panel" class="panel-card" aria-labelledby="viewer-title" hidden>
          <div class="score-toolbar">
            <button id="back-button" class="text-button" type="button">목록으로</button>
            <button id="delete-button" class="text-button danger" type="button">악보 삭제</button>
          </div>
          <h2 id="viewer-title"></h2>
          <p id="viewer-meta" class="viewer-meta"></p>
          <p id="viewer-message" class="notice" role="status" hidden></p>
          <section id="viewer-history" class="score-history" aria-label="연주 이력"></section>
          <div id="viewer-pages" class="viewer-pages"></div>
        </section>
      </div>
    </div>
  </main>

  <div id="camera-overlay" class="camera-overlay" role="dialog" aria-modal="true" aria-label="연속 촬영" hidden>
    <video id="camera-video" class="camera-video" playsinline muted autoplay></video>
    <p id="camera-count" class="camera-count" aria-live="polite">0/10</p>
    <div class="camera-bar">
      <img id="camera-last" class="camera-last" alt="" hidden />
      <button id="shutter-button" class="shutter-button" type="button" aria-label="촬영"></button>
      <button id="camera-done" class="camera-done" type="button">완료</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script type="module" src="scores.js"></script>
</body>
</html>
