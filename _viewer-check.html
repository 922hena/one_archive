<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Viewer check (temporary)</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body class="app-page">
  <button id="open" type="button">Open</button>
  <script type="module">
    import { setLocale } from "./js/i18n.js";
    import { openPerformance } from "./js/views/viewer.js";
    import { staffPaperPdf } from "./js/demo-seed.js";

    setLocale("en");
    const params = new URLSearchParams(location.search);
    localStorage.setItem("yearscore-perform", JSON.stringify({
      perView: { landscape: Number(params.get("l") ?? 2), portrait: Number(params.get("p") ?? 2) }
    }));

    function pagePng(label) {
      const canvas = document.createElement("canvas");
      canvas.width = 1240;
      canvas.height = 1754;
      const g = canvas.getContext("2d");
      g.fillStyle = "#fff";
      g.fillRect(0, 0, canvas.width, canvas.height);
      g.strokeStyle = "#333";
      g.lineWidth = 3;
      for (let staff = 0; staff < 10; staff += 1) {
        for (let line = 0; line < 5; line += 1) {
          const y = 260 + staff * 145 + line * 16;
          g.beginPath();
          g.moveTo(90, y);
          g.lineTo(1150, y);
          g.stroke();
        }
      }
      g.fillStyle = "#0B0B0D";
      g.font = "bold 120px sans-serif";
      g.fillText(label, 90, 180);
      return new Promise((done) => canvas.toBlob(done, "image/png"));
    }

    const blobs = new Map();
    const files = [];
    for (let n = 1; n <= 5; n += 1) {
      const path = `check/page-${n}.png`;
      blobs.set(path, await pagePng(`Page ${n}`));
      files.push({ id: `img-${n}`, page_no: n, storage_path: path, mime_type: "image/png" });
    }
    blobs.set("check/staff.pdf", staffPaperPdf("Ave verum corpus"));
    const ctx = {
      db: {
        download: async (path) => blobs.get(path),
        signedUrl: async () => "about:blank"
      }
    };
    const songs = [
      { key: "a", number: "1", label: "Introitus", score: { id: "s1", title: "Sample pictures" }, files },
      { key: "b", number: "2", label: "Kyrie", score: { id: "s2", title: "Ave verum corpus" }, files: [{ id: "pdf-1", page_no: 1, storage_path: "check/staff.pdf", mime_type: "application/pdf" }] }
    ];
    const open = () => openPerformance(ctx, { title: "Check", songs });
    document.querySelector("#open").addEventListener("click", open);
    open();
  </script>
</body>
</html>
